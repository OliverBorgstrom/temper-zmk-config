# The left half is the split central (see Kconfig.defconfig).
# Report the peripheral (right) half's battery level to the host over BLE,
# in addition to the central's own level.
# Note: Windows will not show the second level in its own UI — use a tray app
# such as zmk-battery-center (https://github.com/kot149/zmk-battery-center).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
